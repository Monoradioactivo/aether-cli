name: Auto-merge Release

on:
  pull_request:
    types: [ opened, reopened, synchronize, labeled, unlabeled ]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate the gate and report without touching the pull request"
        type: boolean
        default: true

concurrency:
  group: auto-merge-release
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: read

env:
  RELEASE_BRANCH_PREFIX: release-please--branches--main
  RELEASE_BOT_LOGIN: aetherpush-release-bot[bot]
  GATE_CONTEXT: Release auto-merge gate
  GATE_SCRIPT: scripts/check-release-auto-merge.mjs
  RECHECK_LABEL: release-gate-recheck

jobs:
  gate:
    name: Release auto-merge gate
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this run has anything to do
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_STATE: ${{ github.event.pull_request.state }}
        run: |
          APPLIES=true
          if [ "$EVENT" = "pull_request" ]; then
            case "$HEAD_REF" in
              "$RELEASE_BRANCH_PREFIX"*) ;;
              *) APPLIES=false ;;
            esac
            if [ "$PR_STATE" != "open" ]; then
              APPLIES=false
            fi
          fi
          echo "applies=$APPLIES" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.scope.outputs.applies == 'true'

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.applies == 'true'
        with:
          node-version: "22"

      - name: Generate App token
        id: app-token
        if: steps.scope.outputs.applies == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Resolve the release pull request
        id: pr
        if: steps.scope.outputs.applies == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            CANDIDATE="$EVENT_PR"
          else
            CANDIDATE=$(gh pr list --repo "$GITHUB_REPOSITORY" \
              --state open --json number,headRefName \
              --jq "[.[] | select(.headRefName | startswith(\"$RELEASE_BRANCH_PREFIX\"))] | .[0].number // empty")
          fi

          if [ -z "$CANDIDATE" ]; then
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FACTS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$CANDIDATE" \
            --jq '{author: .user.login, head: .head.ref, state: .state}')
          AUTHOR=$(echo "$FACTS" | jq -r .author)
          HEAD=$(echo "$FACTS" | jq -r .head)
          STATE=$(echo "$FACTS" | jq -r .state)

          case "$HEAD" in "$RELEASE_BRANCH_PREFIX"*) ;; *) AUTHOR="rejected" ;; esac
          if [ "$AUTHOR" != "$RELEASE_BOT_LOGIN" ] || [ "$STATE" != "open" ]; then
            echo "::notice::#$CANDIDATE is not an open release-please pull request; ignoring."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Evaluate the gate
        id: gate
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECKS_GH_TOKEN: ${{ github.token }}
          VERIFIED_LABEL_ACTORS: ${{ vars.VERIFIED_LABEL_ACTORS }}
          PR: ${{ steps.pr.outputs.number }}
        run: node "$GATE_SCRIPT" "$PR"

      - name: Require a verdict from the gate
        if: steps.pr.outputs.number != '' && steps.gate.outputs.ok == ''
        run: |
          echo "::error::The gate step finished without writing a verdict, so no commit in this release has been vouched for. Nothing is armed or merged until it does."
          exit 1

      - name: Confirm this gate is a required check
        id: required
        if: steps.gate.outputs.ok == 'true' && vars.RELEASE_AUTO_MERGE_ARM == 'true' && !inputs.dry_run
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          IDS=""
          READER=""
          for CANDIDATE in app default; do
            if [ "$CANDIDATE" = "app" ]; then TOKEN="$APP_TOKEN"; else TOKEN="$DEFAULT_TOKEN"; fi
            if IDS=$(GH_TOKEN="$TOKEN" gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq '.[].id'); then
              READER="$CANDIDATE"
              GH_TOKEN="$TOKEN"
              export GH_TOKEN
              break
            fi
          done

          if [ -z "$READER" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not arming. The rulesets could not be read with either token, so it cannot be confirmed that '$GATE_CONTEXT' is a required check. Grant the release bot App repository administration read, or widen the workflow token."
            echo "Not arming #$PR: rulesets unreadable with either token, so the required-check backstop could not be confirmed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Read the rulesets with the $READER token." >> "$GITHUB_STEP_SUMMARY"

          CONTEXTS=""
          for ID in $IDS; do
            CONTEXTS="$CONTEXTS
          $(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ID" \
              --jq '[.rules[]? | select(.type=="required_status_checks") | .parameters.required_status_checks[].context] | .[]' || true)"
          done

          if echo "$CONTEXTS" | sed 's/^[[:space:]]*//' | grep -qxF "$GATE_CONTEXT"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not arming. '$GATE_CONTEXT' is not a required status check, so auto-merge could race a new commit into the release."
            {
              echo "Not arming #$PR."
              echo ""
              echo "The gate passed, but '$GATE_CONTEXT' is not among the ruleset's required status checks,"
              echo "so GitHub would not stop a merge that this workflow armed and then had to disarm."
              echo "Add it to the ruleset and this arms itself on the next evaluation, with nothing else to change."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Arm the merge
        id: arm
        if: steps.required.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          STATUS=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$STATUS" = "CLEAN" ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash
            echo "result=merged" >> "$GITHUB_OUTPUT"
            echo "Merged #$PR directly; its required checks were already green." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --auto
            echo "result=auto" >> "$GITHUB_OUTPUT"
            echo "Auto-merge armed on #$PR (merge state $STATUS)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Re-evaluate the pull request check after a scheduled recovery
        if: steps.arm.outputs.result == 'auto' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECKS_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          trap 'echo "::warning::The gate recheck for #$PR failed; nothing was disarmed and the next run tries again."; echo "Gate recheck for #$PR failed; nothing was disarmed and the next run tries again." >> "$GITHUB_STEP_SUMMARY"' ERR
          FACTS=$(GH_TOKEN="$APP_TOKEN" gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,mergeStateStatus,headRefOid,labels)
          STATE=$(echo "$FACTS" | jq -r .state)
          MERGE_STATE=$(echo "$FACTS" | jq -r .mergeStateStatus)
          HEAD_SHA=$(echo "$FACTS" | jq -r .headRefOid)
          LABELLED=$(echo "$FACTS" | jq -r --arg label "$RECHECK_LABEL" 'any(.labels[]; .name == $label)')
          if [ "$STATE" != "OPEN" ] || [ "$MERGE_STATE" = "DIRTY" ]; then
            echo "No recheck for #$PR: state $STATE, merge state $MERGE_STATE." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CHECK_NAME=$(jq -rn --arg name "$GATE_CONTEXT" '$name | @uri')
          LATEST=$(GH_TOKEN="$CHECKS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=$CHECK_NAME&per_page=100" \
            --jq '.check_runs | sort_by(.id) | last | {status: (.status // "missing"), conclusion: (.conclusion // "")}')
          CHECK_STATUS=$(echo "$LATEST" | jq -r .status)
          CONCLUSION=$(echo "$LATEST" | jq -r .conclusion)
          if [ "$CHECK_STATUS" != "completed" ] && [ "$CHECK_STATUS" != "missing" ]; then
            echo "No recheck for #$PR: the gate check on $HEAD_SHA is $CHECK_STATUS." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$CONCLUSION" in
            success|neutral|skipped)
              echo "No recheck for #$PR: the gate check on $HEAD_SHA already reports $CONCLUSION." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          if [ "$LABELLED" = "true" ]; then
            GH_TOKEN="$APP_TOKEN" gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$RECHECK_LABEL" --silent
            ACTION="Removed"
          else
            GH_TOKEN="$APP_TOKEN" gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=$RECHECK_LABEL" --silent
            ACTION="Added"
          fi
          echo "$ACTION '$RECHECK_LABEL' on #$PR so the gate check re-evaluates $HEAD_SHA (last result: ${CONCLUSION:-none})." >> "$GITHUB_STEP_SUMMARY"

      - name: Hold the release for a human
        if: steps.gate.outputs.ok == 'false' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REASONS: ${{ steps.gate.outputs.reasons }}
          MARKER_ID: ${{ steps.gate.outputs.marker }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -o pipefail
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto || true
          if ! REPORTED=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '.[] | select((.body // "") | startswith("<!-- release-auto-merge-gate")) | .body | split("\n")[0] | rtrimstr("\r")' \
            | tail -n 1); then
            echo "::error::Could not read the comments on #$PR, so nobody can tell whether this hold was reported."
            echo "Could not read the comments on #$PR; this hold may be unreported." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$MARKER_ID" ]; then
            echo "::warning::The gate wrote no marker for #$PR, so this run can only tell whether a hold comment exists at all."
            MARKER_ID="<!-- release-auto-merge-gate -->"
            if [ -n "$REPORTED" ]; then
              echo "Left #$PR alone: the gate wrote no marker and a hold comment is already there." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [ "$REPORTED" = "$MARKER_ID" ]; then
            echo "Left #$PR alone: its newest hold comment already reports these reasons." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! printf '%s\nThis release is held for a human merge:\n\n%s\n' "$MARKER_ID" "$REASONS" \
            | gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file -; then
            echo "::error::Could not comment on #$PR, so this hold is not reported to anyone."
            echo "Could not comment on #$PR; this hold is not reported." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Commented on #$PR: its reasons differ from the newest hold comment there." >> "$GITHUB_STEP_SUMMARY"

      - name: Disarm if this run failed
        if: failure() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto || true

      - name: Report the verdict
        if: steps.pr.outputs.number != ''
        env:
          REASONS: ${{ steps.gate.outputs.reasons }}
          OK: ${{ steps.gate.outputs.ok }}
          PR: ${{ steps.pr.outputs.number }}
          ARMED: ${{ vars.RELEASE_AUTO_MERGE_ARM }}
        run: |
          {
            echo "Verdict for #$PR: ok=$OK (arming enabled: ${ARMED:-false})"
            echo ""
            echo "$REASONS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the release is not accounted for
        if: steps.gate.outputs.ok == 'false' && github.event_name != 'schedule'
        run: |
          echo "::error::The release contains commits this gate cannot vouch for."
          exit 1
