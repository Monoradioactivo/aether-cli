name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^dependabot/ ]] || [[ "$BRANCH" =~ ^release-please-- ]]; then
            echo "Skipping branch name policy for bot branch '$BRANCH'."
            exit 0
          fi
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|refactor|docs|test)/ ]]; then
            echo "::error::Branch '$BRANCH' must start with feat/, fix/, chore/, refactor/, docs/, or test/"
            exit 1
          fi
          echo "Branch '$BRANCH' is valid."

  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and typecheck
        run: npm run build

      - name: Workflow run interpolation tests
        run: node --test scripts/workflow-run-interpolation.test.mjs

      - name: Test
        run: npm test
