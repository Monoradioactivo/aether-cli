name: Commit provenance

on:
  pull_request:
    types: [ opened, reopened, synchronize, labeled, unlabeled, ready_for_review ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commit-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Commit provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Judge every commit in the pull request against main
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_SENDER: ${{ github.event.sender.login }}
        run: node scripts/check-commit-provenance.mjs
