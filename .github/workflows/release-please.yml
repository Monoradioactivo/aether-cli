name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build the npm package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        env:
          TAG_VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Pack
        id: pack
        run: |
          set -o pipefail
          TARBALL=$(npm pack | tail -n 1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to >=11.5.1
        run: npm install -g npm@latest

      - name: Verify the package matches the tag
        env:
          TAG_VERSION: ${{ needs.release-please.outputs.tag_name }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(tar -xOzf "$TARBALL" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>console.log(JSON.parse(s).version))')
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match the packed version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm with provenance
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public --ignore-scripts
